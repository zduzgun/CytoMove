<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Opening Cytomove</title>
  <script>
    (function () {
      var target = new URL(window.location.href);
      target.pathname = '/app/';
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Opening <a id="appLink" href="../app/">Cytomove</a>…</p>
  <script>
    var fallback = new URL('../app/', window.location.href);
    fallback.search = window.location.search;
    fallback.hash = window.location.hash;
    document.getElementById('appLink').href = fallback.href;
  </script>
</body>
</html>
